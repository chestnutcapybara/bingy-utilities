name: Build and Release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:

jobs:
  build-windows-x64:
    runs-on: windows-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka

      - name: Build Windows x64
        shell: cmd
        run: |
          python -m nuitka ^
            --standalone ^
            --jobs=4 ^
            --show-progress ^
            --plugin-enable=pyside6 ^
            --include-qt-plugins=platforms ^
            --windows-icon-from-ico=icon.ico ^
            --noinclude-qt-translations ^
            --remove-output ^
            --include-data-files=DMSans-Regular.ttf=DMSans-Regular.ttf ^
            --include-data-files=DMSans-Bold.ttf=DMSans-Bold.ttf ^
            --include-raw-dir=widgets=widgets ^
            --include-data-files=icon.ico=icon.ico ^
            --output-dir=dist/windows-x64 ^
            --assume-yes-for-downloads ^
            main.py

      - name: Zip Windows Build
        run: |
          powershell Compress-Archive -Path dist/windows-x64/* -DestinationPath windows-x64.zip

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-build
          path: windows-x64.zip


  build-ubuntu-x64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka

      - name: Build Ubuntu x64
        run: |
          python -m nuitka \
            --standalone \
            --jobs=4 \
            --show-progress \
            --plugin-enable=pyside6 \
            --include-qt-plugins=platforms \
            --noinclude-qt-translations \
            --remove-output \
            --include-data-files=DMSans-Regular.ttf=DMSans-Regular.ttf \
            --include-data-files=DMSans-Bold.ttf=DMSans-Bold.ttf \
            --include-raw-dir=widgets=widgets \
            --output-dir=dist/linux-x64 \
            --assume-yes-for-downloads \
            main.py

      - name: Zip Linux Build (FLATTENED)
        run: |
          cd dist/linux-x64
          zip -r ../../ubuntu-x64.zip .

      - name: Upload Linux Build
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-x64-build
          path: ubuntu-x64.zip


  build-macos-x64:
    runs-on: macos-15-intel

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka

      - name: Build macOS x64
        run: |
          python -m nuitka \
            --standalone \
            --jobs=4 \
            --show-progress \
            --plugin-enable=pyside6 \
            --include-qt-plugins=platforms \
            --noinclude-qt-translations \
            --remove-output \
            --include-data-files=DMSans-Regular.ttf=DMSans-Regular.ttf \
            --include-data-files=DMSans-Bold.ttf=DMSans-Bold.ttf \
            --include-raw-dir=widgets=widgets \
            --output-dir=dist/macos-x64 \
            --assume-yes-for-downloads \
            main.py

      - name: Zip macOS Build (FLATTENED)
        run: |
          cd dist/macos-x64
          zip -r ../../macos-x64.zip .

      - name: Upload macOS Build
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64-build
          path: macos-x64.zip


  build-macos-arm64:
    runs-on: macos-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka

      - name: Build macOS ARM64
        run: |
          python -m nuitka \
            --standalone \
            --jobs=4 \
            --show-progress \
            --plugin-enable=pyside6 \
            --include-qt-plugins=platforms \
            --noinclude-qt-translations \
            --remove-output \
            --include-data-files=DMSans-Regular.ttf=DMSans-Regular.ttf \
            --include-data-files=DMSans-Bold.ttf=DMSans-Bold.ttf \
            --include-raw-dir=widgets=widgets \
            --output-dir=dist/macos-arm64 \
            --assume-yes-for-downloads \
            main.py

      - name: Zip macOS ARM64 Build (FLATTENED)
        run: |
          cd dist/macos-arm64
          zip -r ../../macos-arm64.zip .

      - name: Upload macOS ARM64 Build
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-build
          path: macos-arm64.zip


  create-release:
    needs:
      - build-windows-x64
      - build-ubuntu-x64
      - build-macos-x64
      - build-macos-arm64

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download Windows Build
        uses: actions/download-artifact@v4
        with:
          name: windows-x64-build
          path: binaries

      - name: Download Ubuntu Build
        uses: actions/download-artifact@v4
        with:
          name: ubuntu-x64-build
          path: binaries

      - name: Download macOS x64 Build
        uses: actions/download-artifact@v4
        with:
          name: macos-x64-build
          path: binaries

      - name: Download macOS ARM64 Build
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64-build
          path: binaries

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            binaries/windows-x64.zip
            binaries/ubuntu-x64.zip
            binaries/macos-x64.zip
            binaries/macos-arm64.zip